<svg
  width="120"
  height="120"
  viewBox="0 0 120 120"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Black rectangular background -->
  <rect width="120" height="120" fill="#000000" />
  
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <!-- We merge the blur with the original graphic to create a soft glow -->
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Centered and Scaled D Logo (80% scale, perfectly centered) -->
  <g transform="translate(16.8, 12) scale(0.8)" filter="url(#glow)">
    <path
      d="M19 8 L19 112"
      stroke="#ffffff"
      stroke-width="10"
      stroke-linecap="round"
    />
    <path
      d="M19 8 C19 8 72 8 78 14 C90 26 90 50 90 60 C90 70 90 94 78 106 C72 112 19 112 19 112"
      stroke="#ffffff"
      stroke-width="10"
      fill="none"
      stroke-linecap="round"
    />
    <path
      d="M28 28 C38 35 70 42 72 62 C74 80 55 92 38 98"
      stroke="#ffffff"
      stroke-width="5"
      fill="none"
      stroke-linecap="round"
    />
    <path
      d="M28 40 C42 48 62 56 62 72 C62 84 50 94 38 100"
      stroke="#ffffff"
      stroke-width="3"
      fill="none"
      stroke-linecap="round"
      opacity="0.75"
    />
  </g>
</svg>
